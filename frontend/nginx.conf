server {
    listen 80;
    server_name localhost;

    # Directorio donde Nginx busca los archivos estáticos
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para que la web cargue súper rápido en el navegador
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Si el usuario navega a /dashboard o /simulations, Nginx no encuentra esa carpeta en disco,
    # así que 'try_files' lo redirige transparentemente a index.html para que React Router tome el control.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché estricta para archivos estáticos con hash único en el nombre (assets de Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Endpoint para que Kubernetes sepa que Nginx está vivo
    location /health {
        access_log off;
        return 200 "healthy\n";
    }
}