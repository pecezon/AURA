server {
    listen 80;
    server_name localhost;

    # Directory where Nginx serves static files
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression for faster asset delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # SPA fallback: redirect non-file requests to index.html so React Router handles client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Strict caching for immutable assets with unique content hashes (Vite build chunks)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Health check endpoint for container probes
    location /health {
        access_log off;
        return 200 "healthy\n";
    }
}
